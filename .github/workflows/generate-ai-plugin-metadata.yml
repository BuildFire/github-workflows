name: Generate AI Plugin Metadata (Reusable)

on:
  workflow_call:
    secrets:
      PLUGIN_AI_METADATA_OPENAI_API_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4
        with:
          path: plugin-repo

      - name: Checkout shared automation repo
        uses: actions/checkout@v4
        with:
          repository: BuildFire/.github
          path: shared-automation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Run Codex metadata generation
        working-directory: plugin-repo
        env:
          OPENAI_API_KEY: ${{ secrets.PLUGIN_AI_METADATA_OPENAI_API_KEY }}
        run: |
          codex exec --full-auto "$(cat ../shared-automation/prompts/plugin-ai-metadata.prompt.md)"

      - name: Create PR if metadata changed
        uses: peter-evans/create-pull-request@v6
        with:
          path: plugin-repo
          commit-message: "chore: update AI plugin metadata"
          title: "chore: update AI plugin metadata"
          body: |
            Auto-generated AI metadata files.

            Updated:
            - ai/plugin.plan.json
            - ai/plugin.index.json
            - ai/plugin.mcp.json
          branch: chore/update-ai-plugin-metadata
          delete-branch: true
