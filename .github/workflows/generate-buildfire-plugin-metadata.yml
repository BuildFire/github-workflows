name: Generate BuildFire Plugin Metadata (Reusable)

on:
  workflow_call:
    secrets:
      PLUGIN_AI_METADATA_OPENAI_API_KEY:
        required: true
      PLUGIN_AI_METADATA_GH_TOKEN:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v5
        with:
          path: plugin-repo

      - name: Checkout shared automation repo
        uses: actions/checkout@v5
        with:
          repository: BuildFire/github-workflows
          path: shared-automation
          token: ${{ secrets.PLUGIN_AI_METADATA_GH_TOKEN }}

      - name: Run Codex metadata generation
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.PLUGIN_AI_METADATA_OPENAI_API_KEY }}
          working-directory: plugin-repo
          prompt-file: shared-automation/prompts/buildfire-plugin-metadata.prompt.md
          model: gpt-5.4-mini
          effort: medium

      - name: Create PR if metadata changed
        uses: peter-evans/create-pull-request@v8
        with:
          path: plugin-repo
          commit-message: "chore: update BuildFire plugin metadata"
          title: "chore: update BuildFire plugin metadata"
          body: |
            Auto-generated BuildFire plugin metadata files.

            Updated:
            - .buildfire/plugin.plan.json
            - .buildfire/plugin.index.json
            - .buildfire/plugin.mcp.json
          branch: chore/update-buildfire-plugin-metadata
          delete-branch: true
