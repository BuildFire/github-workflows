name: Check BuildFire Plugin Contract (Reusable)

# Filename kept as generate-buildfire-plugin-metadata.yml even though its job changed: every plugin
# repo's caller references this path in its own workflow's `uses:` line, and renaming it would break
# all of them silently until each one is updated by hand. Rename only alongside updating every caller.
#
# This workflow does not inspect the plugin or open a pull request. It tells the contract service that
# a push landed, and the service does the rest — reading the repo, deciding what the contract files
# should be, and opening the PR itself.
#
# So there is no checkout here of anything: not the plugin, not this repo. The job sends one HTTP
# request and finishes, which is why it needs no write access to any repository. The service runs
# outside GitHub and carries its own credentials.

on:
  workflow_call:
    inputs:
      service_url:
        description: >
          Contract-check service to notify. Leave unset: the shared endpoint in DEFAULT_SERVICE_URL
          below is used, so changing it there changes it for every caller at once. Override this per
          repo only to reach a service you are running yourself, e.g. a tunnel to your laptop while
          developing (see "Developing against a local service" in the README).

          Empty is treated the same as unset. Callers written against the earlier version of this
          workflow pass `service_url: ''` to mean "use the mock" — that mode is gone, and falling back
          rather than erroring keeps those repos working until their caller is tidied up.
        required: false
        type: string
        default: ''
    secrets:
      # Shared secret the service uses to verify the caller. Optional so a local service can be run
      # without one, but a real endpoint that opens pull requests on demand should not be callable by
      # anyone who learns its URL.
      CONTRACT_SERVICE_TOKEN:
        required: false

# Nothing here reads or writes the repository: the service does that itself, under its own
# credentials. `contents: read` is simply the smallest thing a job can be granted.
permissions:
  contents: read

jobs:
  notify-contract-service:
    runs-on: ubuntu-latest

    env:
      # The one place the shared endpoint is written. It lives here rather than in the input's
      # `default:` so that an unset input and an explicitly empty one resolve identically — a
      # `default:` is skipped when a caller passes '', which would single out exactly the repos that
      # have not been migrated yet.
      DEFAULT_SERVICE_URL: 'https://contract-check.buildfire.com'

    steps:
      # The whole job of this workflow: tell the service which commit landed, and let it take over.
      # Context values go through env rather than being interpolated into the script, so a branch or
      # actor name can never be read as shell.
      - name: Notify the contract service
        env:
          SERVICE_URL: ${{ inputs.service_url }}
          SERVICE_TOKEN: ${{ secrets.CONTRACT_SERVICE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          # Unset and empty both land on the shared endpoint. Without this an empty value would POST to
          # "/check-contract" with no host, and curl's error for that reads as a malformed-URL problem
          # rather than a stale-config one.
          if [ -z "$SERVICE_URL" ]; then
            SERVICE_URL="$DEFAULT_SERVICE_URL"
            echo "::warning::service_url was passed empty; using the shared endpoint. Drop the input from this repo's caller."
          fi

          payload=$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg ref "$REF" \
            --arg sha "$SHA" \
            --arg event "$EVENT" \
            '{repository: $repository, ref: $ref, sha: $sha, event: $event}')

          echo "notifying $SERVICE_URL/check-contract for $REPOSITORY@$SHA"

          # Built as an array rather than inline ${TOKEN:+-H "..."}: that idiom keeps the header as one
          # argument in bash but splits it in some other shells, which is a needless thing to depend on
          # for a header that carries a secret.
          auth_header=()
          if [ -n "$SERVICE_TOKEN" ]; then
            auth_header=(-H "Authorization: Bearer $SERVICE_TOKEN")
          fi

          # --fail-with-body: a non-2xx exits non-zero *and* still prints what the service said, so a
          # rejection is visible in the log rather than a bare exit code.
          # 120s covers a service that clones and inspects the repo before answering, which the local
          # mock does. A production service should ack immediately and work asynchronously, so this can
          # come down once the real one behaves that way.
          curl --fail-with-body -sS -X POST "$SERVICE_URL/check-contract" \
            -H 'Content-Type: application/json' \
            "${auth_header[@]}" \
            --max-time 120 \
            -d "$payload"
